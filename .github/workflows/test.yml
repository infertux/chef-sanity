name: Test chef-sanity

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # run weekly on Sundays

permissions:
  contents: read

jobs:
  kitchen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ["default-debian-13"]
        chef_version: [18, 19]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run Test Kitchen suite ${{ matrix.suite }} with Cinc ${{ matrix.chef_version }}
        run: bundle exec rake kitchen:${{ matrix.suite }}
        env:
          CHEF_VERSION: ${{ matrix.chef_version }}
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run style checks
        run: bundle exec rake style:ruby
  ci:
    # single status check to require in branch protection: it doesn't change with the matrix
    if: always()
    needs: [kitchen, style]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
