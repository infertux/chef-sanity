name: Test chef-sanity

on:
  push:
    branches: [master] # pull requests are tested by the pull_request event, don't run twice
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # run weekly on Sundays

permissions:
  contents: read

jobs:
  kitchen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ["default-debian-13"]
        chef_version: [18, 19]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false # no job pushes, keep the token off the disk
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run Test Kitchen suite ${{ matrix.suite }} with Cinc ${{ matrix.chef_version }}
        run: bundle exec rake kitchen:${{ matrix.suite }}
        env:
          CHEF_VERSION: ${{ matrix.chef_version }}
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Run style checks
        run: bundle exec rake style:ruby
  network:
    # switching from ifupdown to systemd-networkd, which Test Kitchen can't cover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install dnsmasq
        run: sudo apt-get update && sudo apt-get install -y dnsmasq-base
      - name: Run network tests, with IPv6
        run: sudo env REQUIRE_IPV6=1 test/network/test.sh
  ci:
    # single status check to require in branch protection: it doesn't change with the matrix
    if: always()
    needs: [kitchen, style, network]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
