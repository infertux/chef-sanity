---
driver:
  name: dokken
  privileged: true # allows systemd services to start
  chef_image: cincproject/cinc
  chef_version: <%= ENV.fetch('CHEF_VERSION', 19) %>

provisioner:
  name: dokken
  product_name: cinc
  chef_binary: /opt/cinc/bin/cinc-client
  deprecations_as_errors: true
  multiple_converge: 2

transport:
  name: dokken

verifier:
  name: inspec
  # a platform or suite list would replace this one rather than add to it
  inspec_tests:
    - git: https://github.com/dev-sec/linux-baseline
    - git: https://github.com/dev-sec/linux-patch-baseline
    - git: https://github.com/dev-sec/ssh-baseline
    - path: profile/controls
  waiver_files:
    - test/integration/default/waivers.yml

platforms:
  # @see https://github.com/chef-cookbooks/testing_examples/blob/main/kitchen.dokken.yml
  # @see https://hub.docker.com/u/dokken
  - name: debian-13
    driver:
      image: dokken/debian-13
      pid_one_command: /usr/lib/systemd/systemd
      intermediate_instructions:
        - RUN /usr/bin/apt-get update
        - RUN /usr/bin/apt-get upgrade -y
        - RUN /usr/bin/apt-get purge exim4* -y

suites:
  - name: default
    run_list:
      - recipe[sanity::default]
    attributes:
      sanity:
        ssh: { authorized_keys: ["ssh-ed25519 AAAA+testkey test@example.net"] }
        ipv6: false # XXX: no IPv6 connectivity available with dokken
        root_email: test@example.local
        postfix:
          # unreachable relay: emails stay queued, which lets tests inspect them
          relay: { host: "[smtp.example.local]:587", username: test@example.local, password: secret }
        monit: { start_delay: 0 } # start Monit immediately to run tests
